<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van de Graaff Lab</title>
<meta name="description" content="A Van de Graaff generator simulator for high school physics: 21 guided electrostatics demonstrations plus a free-play bench.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a dark lab "stage" on the left that you operate, a notebook panel on the right that walks Predict -> Test -> Explain. */
:root{
  --bg:#e8ecf1; --surface:#ffffff; --surface-2:#f2f5f8; --ink:#16202c; --ink-2:#4c5a6b; --line:#d2d9e2;
  --accent:#f2b705; --accent-ink:#241b00; --accent-soft:#fff3c9;
  --neg:#1d5bd8; --pos:#cf352d; --ok:#177a45; --ok-soft:#e1f3e8; --warn:#9a5a00; --warn-soft:#fff1d6;
  --stage:#1a2330;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131a; --surface:#171f29; --surface-2:#1f2935; --ink:#e7ecf2; --ink-2:#9fadbd; --line:#2e3a49;
    --accent:#f6c318; --accent-ink:#1f1700; --accent-soft:#3a3007;
    --neg:#7bb0ff; --pos:#ff8377; --ok:#5ccb8e; --ok-soft:#143524; --warn:#f3c267; --warn-soft:#3a2c0c;
    --stage:#141b25; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);min-height:100dvh;display:flex;flex-direction:column}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font:700 23px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin-right:4px}
.brand svg{width:26px;height:30px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font:600 17px/1.1 var(--f-display);letter-spacing:.02em;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.demo-nav{display:flex;align-items:center;gap:4px;flex:1 1 260px;min-width:0}
.demo-nav .pick{flex:1;min-width:0;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 12px;font:600 18px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-nav .pick b{color:var(--ink-2);font-weight:600;margin-right:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;width:36px;height:36px;font:700 20px/1 var(--f-display);flex:none}
.settings{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.settings .lbl{font:600 14px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.seg.pol button{font-family:var(--f-mono);font-size:16px;padding:5px 12px}
.seg.pol button[aria-pressed="true"][data-v="-1"]{background:var(--neg);color:#fff}
.seg.pol button[aria-pressed="true"][data-v="1"]{background:var(--pos);color:#fff}

.lab{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;padding:12px 16px;align-items:start}
.stage-col{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
.stage-wrap{position:relative;width:min(100%,calc((100dvh - 172px)*1000/620));min-width:min(100%,520px);aspect-ratio:1000/620;background:var(--stage);border-radius:12px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 10px 30px -18px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.lock{position:absolute;inset:0;display:grid;place-items:end center;padding:22px;background:rgba(10,14,20,.5);color:#fff;font:600 clamp(14px,2.6vw,20px)/1.2 var(--f-display);letter-spacing:.03em;text-align:center}
.lock span{background:rgba(10,14,20,.82);border:1px solid rgba(255,255,255,.18);padding:10px 16px;border-radius:999px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:min(90%,560px);background:#fff7d6;color:#241b00;border-radius:10px;padding:8px 14px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:opacity .25s;text-align:center}
.toast[data-off]{opacity:0;pointer-events:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font:600 17px/1.1 var(--f-display);letter-spacing:.02em;display:inline-flex;align-items:center;gap:7px;min-height:38px}
.btn:hover{border-color:var(--ink-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.power{min-width:132px;justify-content:center}
.btn.power[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn .led{width:9px;height:9px;border-radius:50%;background:var(--ink-2);opacity:.5}
.btn.power[aria-pressed="true"] .led{background:#178a3e;opacity:1;box-shadow:0 0 0 3px rgba(23,138,62,.25)}
.field{display:inline-flex;align-items:center;gap:6px;font:600 16px/1 var(--f-display);color:var(--ink-2)}
.field select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 8px;min-height:38px;font:600 16px/1.1 var(--f-display);color:var(--ink)}
.spacer{flex:1 1 0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 16px 20px;max-height:calc(100dvh - 82px);overflow:auto;min-width:0;display:flex;flex-direction:column;gap:14px}
.eyebrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:600 14px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;letter-spacing:.04em;white-space:nowrap}
.chip.core{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.panel h1{font:700 32px/1.02 var(--f-display);margin:0;text-wrap:balance}
.panel h1 small{font:500 22px/1 var(--f-mono);color:var(--ink-2);margin-right:8px}
.panel h2{font:700 20px/1.1 var(--f-display);letter-spacing:.02em;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--ink-2)}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0;padding:0;list-style:none}
.stepper li{border-top:4px solid var(--line);padding-top:6px;font:600 16px/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.stepper li[data-on]{border-color:var(--accent);color:var(--ink)}
.stepper li[data-done]{border-color:var(--ok);color:var(--ink-2)}
.block{display:flex;flex-direction:column;gap:10px}
.q{margin:0;font-weight:700}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface-2);cursor:pointer}
.opt:hover{border-color:var(--ink-2)}
.opt input{margin:3px 0 0;accent-color:var(--ink);flex:none;width:16px;height:16px}
.opt:has(input:checked){border-color:var(--ink);background:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--pos)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:9px;align-items:start;padding:8px 10px;border-radius:9px;border:1px solid transparent;color:var(--ink-2)}
.steps li::before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);font:500 14px/1 var(--f-mono)}
.steps li[data-now]{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.steps li[data-now]::before{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.steps li[data-done]{color:var(--ink)}
.steps li[data-done]::before{content:"✓";border-color:var(--ok);background:var(--ok);color:#fff;font-family:var(--f-body);font-weight:700}
.steps .note{margin:6px 0 0;color:var(--ok);font-weight:700}
.steps .opt-tag{font:600 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}
.steps .ask{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.hint{margin:0;padding:8px 10px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-weight:700}
.verdict{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:9px;border:1px solid var(--line)}
.verdict p{margin:0}
.verdict .mark{font:700 16px/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.verdict[data-ok="1"]{border-color:var(--ok);background:var(--ok-soft)}
.verdict[data-ok="1"] .mark{color:var(--ok)}
.verdict[data-ok="0"] .mark{color:var(--pos)}
.why p{margin:0 0 10px}
.why p:last-child{margin-bottom:0}
.sayit{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--surface-2);border-radius:0 9px 9px 0;font-weight:700}
.sayit span{display:block;font:600 13px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
.safety{margin:0;padding:10px 12px;border:1px dashed var(--warn);border-radius:9px;color:var(--ink)}
.safety b{font:700 14px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--warn);display:block;margin-bottom:3px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.link{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:15px}
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log th{font:600 13px/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
table.log td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.log select{max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px;font-size:14px}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:2px;font:600 15px/1.2 var(--f-display)}
.ladder li{padding:3px 9px;border-radius:6px;background:var(--surface-2);display:flex;justify-content:space-between;gap:8px}
.ladder li[data-hit]{background:var(--accent);color:var(--accent-ink)}
.ladder-cap{display:flex;justify-content:space-between;font:600 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tray{display:flex;flex-direction:column;gap:12px}
.tray fieldset{border:1px solid var(--line);border-radius:10px;margin:0;padding:8px 10px 10px;display:flex;flex-wrap:wrap;gap:6px}
.tray legend{font:600 14px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:0 4px}
.tray label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--surface-2);font:600 16px/1.1 var(--f-display);cursor:pointer}
.tray label:has(input:checked){background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tray input{position:absolute;opacity:0;pointer-events:none}
.tray label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.try{margin:0;padding-left:20px;display:grid;gap:6px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100dvh - 48px)}
dialog::backdrop{background:rgba(8,12,18,.6)}
.menu-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.menu-body{padding:12px 16px 18px;display:grid;gap:14px}
.part h3{margin:0 0 6px;font:600 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.part ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.part button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;font:600 17px/1.15 var(--f-display)}
.part button:hover{border-color:var(--ink-2)}
.part button[aria-current="true"]{border-color:var(--ink);background:var(--surface)}
.part button .n{font:500 14px/1 var(--f-mono);color:var(--ink-2)}
.part button .s{font-size:14px;color:var(--ink-2)}
.part button .s[data-done]{color:var(--ok)}

@media (max-width:980px){
  .lab{grid-template-columns:minmax(0,1fr)}
  .stage-wrap{width:100%;min-width:0}
  .panel{max-height:none}
}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 26 30" aria-hidden="true"><circle cx="13" cy="9" r="8" fill="currentColor"/><rect x="10.5" y="15" width="5" height="9" fill="currentColor" opacity=".55"/><rect x="5" y="24" width="16" height="5" rx="1.5" fill="currentColor"/><path d="M21 3l3-2M23 8h3M21 13l3 2" stroke="#f2b705" stroke-width="2" stroke-linecap="round"/></svg>
    Van de Graaff Lab
  </div>
  <div class="seg" role="group" aria-label="Mode">
    <button type="button" id="modeGuided" aria-pressed="true">Guided demos</button>
    <button type="button" id="modeFree" aria-pressed="false">Free play</button>
  </div>
  <div class="demo-nav" id="demoNav">
    <button type="button" class="icon-btn" id="prevDemo" aria-label="Previous demo">‹</button>
    <button type="button" class="pick" id="demoPick" aria-haspopup="dialog"></button>
    <button type="button" class="icon-btn" id="nextDemo" aria-label="Next demo">›</button>
  </div>
  <div class="settings">
    <span class="lbl" id="polLbl">Dome charges</span>
    <div class="seg pol" role="group" aria-labelledby="polLbl">
      <button type="button" data-v="-1" id="polNeg" aria-pressed="true" aria-label="Negative">−</button>
      <button type="button" data-v="1" id="polPos" aria-pressed="false" aria-label="Positive">+</button>
    </div>
    <button type="button" class="btn" id="soundBtn" aria-pressed="false">Sound</button>
  </div>
</header>

<main class="lab">
  <section class="stage-col" aria-label="Lab bench">
    <div class="stage-wrap" id="wrap">
      <canvas id="stage" aria-label="Interactive lab bench with a Van de Graaff generator. Drag objects with a mouse or finger; use the buttons below for power and other controls."></canvas>
      <div class="lock" id="lock" hidden><span>Lock in your prediction to start the demo</span></div>
      <div class="toast" id="toast" role="status" data-off></div>
    </div>
    <div class="toolbar" id="toolbar"></div>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<dialog id="menu" aria-labelledby="menuTitle">
  <div class="menu-head">
    <h2 id="menuTitle" style="font:700 24px/1 var(--f-display);margin:0">Demos at a glance</h2>
    <button type="button" class="btn" id="menuClose">Close</button>
  </div>
  <div class="menu-body" id="menuBody"></div>
</dialog>

<script>
(() => {
'use strict';

/* ================================================================== *
 *  Utilities
 * ================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const sgn = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const ease = (cur, tgt, rate, dt) => cur + (tgt - cur) * (1 - Math.exp(-rate * dt));
const el = (tag, attrs = {}, html) => { const n = document.createElement(tag); for (const k in attrs) { if (k === 'class') n.className = attrs[k]; else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]); } if (html != null) n.innerHTML = html; return n; };

const W = 1000, H = 620;      // world size (canvas is scaled to fit)
const CM = 5.6;               // world units per centimetre (dome radius 70 = 12.5 cm)
const BENCH = 560;            // y of the bench top
const SPARK_GAP = 46;         // longest spark at full charge (about 8 cm)
const EARTH = { x: 44, y: 520 };

const store = {
  get(k, d) { try { const v = localStorage.getItem('vdg.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('vdg.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};

/* Settings shared by every scene */
const S = {
  polarity: store.get('polarity', -1) > 0 ? 1 : -1,
  sound: false,
  charges: false,
  lights: true,
  mode: 'guided',
  done: store.get('done', {})
};

const pol = s => ({
  s, sym: s < 0 ? '−' : '+', name: s < 0 ? 'negative' : 'positive',
  oppSym: s < 0 ? '+' : '−', opp: s < 0 ? 'positive' : 'negative'
});

/* ================================================================== *
 *  Sound (off until the student switches it on)
 * ================================================================== */
const audio = {
  ctx: null, hum: null,
  ensure() { if (!S.sound) return null; if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },
  snap(strength = 1) {
    const c = this.ensure(); if (!c) return;
    const n = Math.floor(c.sampleRate * 0.07), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
    const src = c.createBufferSource(), g = c.createGain(); src.buffer = buf; g.gain.value = 0.3 * strength; src.connect(g).connect(c.destination); src.start();
  },
  setHum(on) {
    if (this.hum && (!on || !S.sound)) { const h = this.hum; this.hum = null; try { h.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05); h.o.stop(this.ctx.currentTime + 0.4); } catch (e) { /* already stopped */ } }
    if (!on || this.hum) return; const c = this.ensure(); if (!c) return;
    const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.value = 58; f.type = 'lowpass'; f.frequency.value = 200; g.gain.value = 0;
    o.connect(f).connect(g).connect(c.destination); o.start(); g.gain.setTargetAtTime(0.03, c.currentTime, 0.2); this.hum = { o, g };
  }
};

/* ================================================================== *
 *  Triboelectric series (top = loves electrons most = becomes negative)
 * ================================================================== */
const SERIES = ['Teflon', 'Vinyl (PVC)', 'Polyethylene', 'Styrofoam', 'Rubber', 'Cotton', 'Paper', 'Silk', 'Wool', 'Nylon', 'Human hair', 'Acrylic', 'Glass', 'Rabbit fur'];
const affinity = m => SERIES.length - SERIES.indexOf(m);
/* charge material `a` ends with after being rubbed with `b` (−1..1) */
function rubCharge(a, b) { const d = affinity(a) - affinity(b); return d ? -sgn(d) * clamp(0.55 + Math.abs(d) * 0.1, 0, 1) : 0; }

/* ================================================================== *
 *  Canvas drawing helpers
 * ================================================================== */
const C = { neg: '#5aa2ff', pos: '#ff6b5e', ink: '#e9eef5', dim: '#93a1b3', skin: '#c99672', sleeve: '#3f8f8a', amber: '#f2b705' };
const FONT = (px, w = 600) => `${w} ${px}px "Barlow Condensed","Arial Narrow",sans-serif`;
const MONO = px => `500 ${px}px "IBM Plex Mono",ui-monospace,monospace`;

function rr(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }
function disc(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function label(c, t, x, y, o = {}) { c.font = o.font || FONT(13); c.textAlign = o.align || 'center'; c.textBaseline = o.base || 'middle'; c.fillStyle = o.col || C.dim; c.fillText(t, x, y); }
function pill(c, t, x, y, col = '#cfd8e3') {
  c.font = FONT(13); const wd = c.measureText(t).width + 14;

{ id: '2.3', part: 2, title: 'Mystery Balloons', slides: '12–14',
  intro: 'Three balloons, A, B and C, were prepared before class. Some were rubbed on hair and some were left alone, and nobody is telling you which.',

  ],
  tools: ['power', 'wand'],

  },
  steps: [
    { t: 'Charge the dome for about 10 seconds, then switch the machine off.', ok: chargedOff },
    { t: 'Hold balloon <b>A</b> near the dome without touching it, let go, and watch.', ok: (w, d) => d.seen[0], hint: lostCharge },

    { t: 'And with balloon <b>C</b>.', ok: (w, d) => d.seen[2], hint: lostCharge },
    { t: 'In the table below, record what each result lets you conclude.', ok: (w, d) => d.allRight }
  ],
  extra(box, w, d) {
    const opts = ['Choose…', 'Same type of charge as the dome', 'Opposite charge OR neutral (can’t tell which)', 'Opposite charge, for sure', 'Neutral, for sure'], want = i => d.seen[i] === 'repel' ? 1 : 2;
    const t = el('table', { class: 'log' }, '<thead><tr><th>Balloon</th><th>Near the dome</th><th>So it has…</th></tr></thead>'), tb = el('tbody');
    d.bal.forEach((b, i) => {
      const tr = el('tr'), td = el('td'), sel = el('select', { id: 'concl' + i, 'aria-label': 'Conclusion for balloon ' + b.label });
      opts.forEach((o, k) => sel.append(new Option(o, k))); sel.value = d.pick[i]; sel.disabled = !d.seen[i]; sel.onchange = () => { d.pick[i] = +sel.value; d.dirty = true; };
      td.append(sel); if (d.pick[i]) td.append(mark(d.pick[i] === want(i)));
      tr.append(el('td', {}, `<b>${b.label}</b>`), el('td', {}, d.seen[i] ? (d.seen[i] === 'repel' ? 'pushed away' : 'pulled in') : '<span style="opacity:.6">not tested</span>'), td); tb.append(tr);
    });
    t.append(tb); box.append(t); d.allRight = d.bal.every((b, i) => d.seen[i] && d.pick[i] === want(i));
    if (d.pick.some((p, i) => p && p !== want(i))) box.append(el('p', { class: 'hint' }, 'Check the three rules: opposites attract, likes repel, and a charged object also attracts a neutral one.'));

{ id: '5.2', part: 5, title: 'Charging an Electroscope by Induction', core: true, slides: '31–33, 37', world: { shelf: { x1: 356, x2: 950, y: 387, label: 'stand' } },
  intro: 'A metal-leaf electroscope has a metal knob on top joined to two thin metal leaves inside a jar. When the leaves share a charge, they push apart.',
  predict: [

  tools: ['power', 'wand', 'finger', 'charges'],
  setup(w, d) { w.add(new Wand(w)); d.sc = w.add(new Scope(w, { x: 790 })); d.b = w.add(new Hanger(w, { px: 935, py: 34, L: 86, q: -1, label: '−', canRub: false })); },
  tick(w, d, dt) {

    if (d.fell && ch && s.finger && I > 0.15) d.gnd = true; if (d.gnd && !s.finger && I > 0.12 && Math.abs(s.q) > 0.12) d.lift = true;
    if (d.lift && I < 0.05 && Math.abs(s.q) > 0.12 && s.ang > 0.12) d.kept = true;
    d.lost = d.gnd && !d.kept && s.finger && I < 0.08;
    if (d.kept && !d.b.held && hyp(d.b.bx - s.kx, d.b.by - s.ky) < 75) d.test = (d.test || 0) + dt;
  },
  steps: [
    { t: 'Start neutral: press <b>Finger on knob</b>, then press it again to take your finger away.', ok: (w, d) => d.s0, note: 'The leaves hang straight down.' },
    { t: 'Charge the dome for about 10 seconds, then switch the machine off.', ok: (w, d) => d.ran && !w.vdg.on },
    { t: 'Slide the electroscope toward the dome, then slide it back. Keep it far enough away that no spark jumps.', ok: (w, d) => d.fell, note: 'The leaves spread when it is near and fall when it moves away. So far this is only polarization.', hint: (w, d) => w.flags.scopeSparked ? 'A spark charged the electroscope by contact. Slide it away and touch the knob with your finger to reset it.' : lostCharge(w) },
    { t: 'Slide it near the dome again. While it is near, press <b>Finger on knob</b>.', ok: (w, d) => d.gnd, note: 'The leaves fall.', hint: lostCharge },
    { t: 'Take your finger off first…', ok: (w, d) => d.lift },
    { t: '…then slide the electroscope away from the dome.', ok: (w, d) => d.kept, note: 'The leaves spread again and stay spread, even far from the dome.', hint: (w, d) => d.lost ? 'Your finger was still on the knob when the electroscope moved away, so the new charge drained off. Slide it near again and take the finger off first.' : '' },
    { t: 'Test it: hang the negative balloon close to the knob.', ok: (w, d) => d.test > 1, opt: true, note: P => P.s < 0 ? 'The leaves close up: the balloon pushes electrons down into positive leaves.' : 'The leaves spread wider: the balloon pushes even more electrons down into negative leaves.' },
    { ask: { q: 'Compared with the dome, the electroscope’s final charge is…', a: ['The opposite type', 'The same type', 'Zero'], ok: 0, no: 'Turn on Show charges and read the “net” label on the electroscope.' } }

{ id: '5.3', part: 5, title: 'Electrophorus Station', slides: '34', world: { vdg: false, cam: { s: 1.538, x: 180, y: 217 } },

  tools: ['poke', 'charges'],
  setup(w, d) { d.ep = w.add(new Electrophorus(w)); },
  steps: [
    { t: 'Drag the wool cloth back and forth across the foam plate to rub it.', ok: (w, d) => d.ep.plate.q <= -0.97, note: 'Styrofoam loves electrons more than wool does, so the plate is negative.' },
    { t: 'Using the foam-cup handle, set the pie tin down on the foam plate.', ok: (w, d) => d.ep.onPlate && !d.ep.tin.held },
    { t: 'Press <b>Touch tin with finger</b>.', ok: (w, d) => d.ep.onPlateSnaps >= 1, note: 'A small snap.' },
    { t: 'Lift the tin by its handle and bring its rim up to the neon bulb.', ok: (w, d) => d.ep.count >= 1, note: 'The bulb flashes.' },
    { t: 'Do it all again without rubbing the plate: set the tin down, touch it, lift it to the bulb.', ok: (w, d) => d.ep.count >= 2, note: 'It works again. The plate never gave up its charge.' },
    { ask: { q: 'What charge did the tin carry up to the bulb?', a: ['Positive', 'Negative', 'None'], ok: 0, no: 'The negative plate pushed electrons to the top of the tin, and your finger let them leave.' } }

  predict: [
    { q: 'Where does the charge actually come from inside the machine?', a: ['Friction where the belt rubs on the roller moves electrons from one to the other', 'A hidden battery inside the base', 'The motor makes brand-new electrons', 'It pours in from the wall outlet'], ok: 0 },
    { q: 'On the triboelectric series, rubber sits above nylon (rubber loves electrons more). Which one should end up negative?', a: ['The rubber belt', 'The nylon roller', 'Both'], ok: 0 }

  tools: ['power', 'wand', 'open', 'roller', 'charges'],
  setup(w, d) { w.add(new Wand(w, { x: 120, y: 100 })); w.vdg.sign = sgn(rubCharge('Rubber', w.vdg.roller)) || -1; d.r0 = w.vdg.roller; },
  tick(w, d, dt) {
    const v = w.vdg; if (!v.on && v.wasGrounded) d.g = true; if (v.domeOff) d.open = true; if (v.domeOff && v.on) d.crank = (d.crank || 0) + dt;
    if (d.crank > 3 && !v.domeOff && Math.abs(v.Q) > 0.8) { if (!d.first) d.first = sgn(v.Q); else if (sgn(v.Q) !== d.first) d.flip = true; }
  },
  steps: [
    { t: 'With the machine off, ground the dome with the wand.', ok: (w, d) => d.g },
    { t: 'Press <b>Lift the dome off</b> and look inside.', ok: (w, d) => d.open, note: 'A motor turning a rubber belt over two rollers. No battery, no hidden charge.' },
    { t: 'Find the belt and the lower roller on the series below.', ask: { q: (P, d, w) => `The belt is rubber and the lower roller is ${w.vdg.roller}. When they rub, which one gains electrons?`, a: ['The rubber belt', 'The roller', 'Neither'], ok: P => P.s < 0 ? 0 : 1, no: 'The material higher on the series loves electrons more, so it gains them and becomes negative.' } },
    { t: 'Switch the power on to turn the belt slowly, and watch the electrons.', ok: (w, d) => d.crank > 3, note: P => P.s < 0 ? 'Electrons collect on the belt at the roller and ride up.' : 'The roller takes electrons from the belt, so the belt carries electrons down, away from the top.' },

  extra(box, w) { ladder(box, { Rubber: 'belt', [w.vdg.roller]: 'lower roller' }); },

{ id: '6.2', part: 6, title: 'Build Your Own Series', slides: '42–43',
  intro: 'Rub an object with a cloth, then use the charged dome as a reference to find out which charge the object picked up. Keep the dome switched off while you test.',
  predict: [
    { q: 'When PVC is rubbed with wool, which one gains electrons?', a: ['The PVC', 'The wool', 'Neither'], ok: 0 },
    { q: 'How can the charged dome tell you what charge an object has?', a: ['If the object is repelled, it has the same type of charge as the dome', 'If the object is attracted, it must have the opposite charge', 'The dome changes color near a charged object'], ok: 0 }
  ],
  tools: ['power', 'wand', 'pair', 'hang', 'charges'],
  setup(w, d) { w.add(new Wand(w)); d.obj = 'pvc'; d.cl = 'Wool'; d.trials = {}; d.ans = {}; this.fresh(w, d); },
  fresh(w, d) {
    if (d.h) w.remove(d.h); if (d.pad) w.remove(d.pad);
    d.pad = w.add(new RubPad(w, { x: 810, y: 320, material: d.cl, label: d.cl.toLowerCase() })); d.h = w.add(new Hanger(w, Object.assign({ px: 660, py: 150 }, OBJ[d.obj]))); d.hang = 'object'; d.objQ = 0; d.t = 0;
  },
  setHang(w, d, what) {
    if (what === d.hang) return; const h = d.h;
    if (what === 'cloth') { d.objQ = h.q; Object.assign(h, { kind: 'cloth', material: d.cl, name: d.cl.toLowerCase() + ' cloth', r: 22, q: d.pad.q, canRub: false }); d.pad.hidden = true; }
    else { d.pad.q = h.q; Object.assign(h, OBJ[d.obj], { q: d.objQ, canRub: true }); d.pad.hidden = false; }
    h.seen = null; h.dAvg = 0; d.hang = what; d.t = 0;
  },
  tick(w, d, dt) {
    ran(w, d); const v = w.vdg, h = d.h, key = d.obj + '|' + d.cl;
    if (d.hang === 'object' && Math.abs(h.q) > 0.5 && !d.trials[key]) { d.trials[key] = { obj: d.obj, cl: d.cl, object: null, cloth: null, q: sgn(h.q) }; d.dirty = true; }
    const tr = d.trials[key]; if (!tr) return;
    if (!h.held && !v.on && h.gap < 200 && Math.abs(v.Q) > 0.5 && Math.abs(h.q) > 0.3) { d.t += dt; if (d.t > 1.2 && h.seen && tr[d.hang] !== h.seen) { tr[d.hang] = h.seen; d.dirty = true; } }
    else if (h.gap > 230) { d.t = 0; h.seen = null; }
  },
  steps: [
    { t: 'Charge the dome for about 10 seconds, then switch the machine off.', ok: chargedOff },
    { t: 'Pick an <b>Object</b> and a <b>Cloth</b>. Drag the object back and forth across the cloth, then hang it near the dome and let go.', ok: (w, d) => Object.values(d.trials).some(t => t.object), hint: lostCharge },
    { t: 'Pulled in? That could mean opposite charge or no charge at all. Press <b>Hang the cloth</b> and test the cloth near the dome too.', ok: (w, d) => Object.values(d.trials).some(t => t.object === 'repel' || t.cloth === 'repel'), hint: lostCharge },
    { t: 'Test three different pairs and record each object’s charge in the class chart below.', ok: (w, d) => d.good >= 3, hint: lostCharge },
    { t: 'Find an object whose charge flips when you swap the cloth.', ok: (w, d) => d.flip, opt: true, note: 'The acrylic rod: negative after rabbit fur, positive after wool, silk or cotton.' }
  ],
  extra(box, w, d) {
    const keys = Object.keys(d.trials), P = pol(w.vdg.sign), say = r => r === 'repel' ? 'pushed away' : r === 'attract' ? 'pulled in' : '—'; d.good = 0; d.flip = false;
    if (!keys.length) { box.append(el('p', { class: 'lede' }, 'The class chart fills in here as you test each pair.')); return; }
    const t = el('table', { class: 'log' }, `<thead><tr><th>Pair rubbed</th><th>Object</th><th>Cloth</th><th>Object is</th></tr></thead>`), tb = el('tbody'), signs = {}; let need = false;
    keys.forEach((k, i) => {
      const tr = d.trials[k], row = el('tr'), td = el('td'), sel = el('select', { id: 'sign' + i, 'aria-label': 'Charge on the ' + OBJ[tr.obj].name });
      [['', 'Choose…'], ['-1', 'negative (−)'], ['1', 'positive (+)']].forEach(o => sel.append(new Option(o[1], o[0]))); sel.value = d.ans[k] || ''; sel.onchange = () => { d.ans[k] = sel.value; d.dirty = true; };
      const proof = tr.object === 'repel' || tr.cloth === 'repel'; td.append(sel);
      if (d.ans[k]) { if (!proof) { need = true; td.append(el('span', { style: 'margin-left:6px;font-weight:700;color:var(--warn)' }, '?')); } else { const right = +d.ans[k] === tr.q; td.append(mark(right)); if (right) { d.good++; (signs[tr.obj] = signs[tr.obj] || new Set()).add(tr.q); } } }
      row.append(el('td', {}, `${OBJ[tr.obj].name} + ${tr.cl.toLowerCase()}`), el('td', {}, say(tr.object)), el('td', {}, say(tr.cloth)), td); tb.append(row);
    });
    t.append(tb); box.append(el('p', { class: 'q' }, `Class chart (the dome is ${P.name})`), t); d.flip = Object.values(signs).some(s => s.size > 1);
    if (need) box.append(el('p', { class: 'hint' }, 'Attraction alone can’t settle it: a neutral object is pulled in too. Hang the cloth and test it. Whatever the cloth is, the object is the opposite.'));
  },
  after(box) { box.append(el('h2', {}, 'Compare with the series')); ladder(box); },
  see: 'Some rubbed objects are repelled by the dome and some are attracted. Swapping the cloth can flip the result.',
  why: () => '<p>When two different materials are rubbed, electrons move to the one with the greater electron affinity. Which material becomes negative depends on its partner’s position in the series (slide 43).</p><p>The dome works as a reference charge, and repulsion is the reliable test (slide 12). When an object is only attracted, test its cloth: the two always end up with opposite charges.</p><p>Compare your chart with the series from slide 42. The same object can end up + with one cloth and − with another.</p>' },

{ id: '6.3', part: 6, title: 'Where Did the Other Charge Go?', slides: '44',
  intro: 'A discussion demo. The counter in the corner keeps score of the charge on four things: a balloon, the hair it is rubbed on, the dome, and the ground.',
  predict: [{ q: 'After the machine runs, the dome is full of charge. Did the machine create that charge?', a: ['No. The electrons were moved from somewhere else', 'Yes. The motor creates charge', 'Yes. Friction makes new electrons'], ok: 0 }],
  tools: ['power', 'wand', 'charges'],
  setup(w, d) { w.add(new Wand(w)); d.pad = w.add(new RubPad(w, { x: 800, y: 330 })); d.b = w.add(new Hanger(w, { px: 640, py: 190 })); w.over.push(c => ledger(c, w, d)); },
  tick(w, d, dt) { ran(w, d); const b = d.b, p = d.pad, dist = hyp(b.bx - (p.x + p.wd / 2), b.by - (p.y + p.ht / 2)); if (b.q < -0.9 && !b.held && dist < 135) d.near = (d.near || 0) + dt; },
  steps: [
    { t: 'Drag the balloon back and forth across the hair and watch the charge count.', ok: (w, d) => d.b.q <= -0.97, note: 'The balloon gains exactly what the hair loses. Together they are still zero.' },
    { t: 'Let the balloon hang just beside the hair without touching it.', ok: (w, d) => d.near > 1, note: 'The hair reaches toward the balloon: both are charged, with opposite types.' },
    { t: 'Now switch the machine on and watch the dome and the ground.', ok: (w, d) => d.ran },
    { ask: { q: P => P.s < 0 ? 'The dome gained electrons. Where did they come from?' : 'The dome lost electrons. Where did they go?', a: P => P.s < 0 ? ['Up from the ground, through the connection at the base', 'The motor made them', 'Friction created them out of nothing'] : ['Down into the ground, through the connection at the base', 'The motor destroyed them', 'They turned into protons'], ok: 0, no: 'Look at the charge count: the dome and the ground always change by equal and opposite amounts.' } }
  ],
  see: 'Whatever the balloon gains, the hair loses. Whatever the dome gains, the ground loses. Each pair always adds up to zero.',
  why: P => `<p>Charge is neither created nor destroyed. It is only transferred from one object to another in the form of electrons (slide 44).</p><p>When a balloon is rubbed on hair, the hair might lose about 2 trillion electrons, and the balloon gains about 2 trillion. The total charge of the system is zero before and after.</p><p>In the generator, the electrons that ${P.s < 0 ? 'collect on a negative dome come in through the ground connection at the base' : 'leave a positive dome go out through the ground connection at the base'}, so the total stays the same.</p>`,
  say: P => P.s < 0 ? 'Every extra electron on the dome is an electron that’s missing from somewhere else.' : 'Every electron missing from the dome is an extra electron somewhere else.' },

{ id: '7.1', part: 7, title: 'Attract, Touch, Repel', core: true, slides: '11, 47–48',

    { q: 'What happens right after the ball touches the dome?', a: ['It is pushed sharply away', 'It sticks to the dome and stays', 'It drops straight down and hangs still'], ok: 0 }

  tools: ['power', 'wand', 'charges'],
  setup(w, d) { w.add(new Wand(w)); d.ball = w.add(new Hanger(w, { stand: 1, px: 650, py: 85, L: 130, r: 10, kind: 'foil', cond: true, polz: 0.7, leak: 3, canRub: false, material: 'Aluminum' })); },
  steps: [
    { t: 'Switch the machine on.', ok: w => w.vdg.on && Math.abs(w.vdg.Q) > 0.8 },
    { t: 'Slowly drag the ring stand toward the dome until the ball responds.', ok: (w, d) => d.ball.touches >= 1, note: 'The ball is pulled to the dome, touches it, then is pushed sharply away.' },
    { t: 'Leave the stand where it is and watch several cycles.', ok: (w, d) => d.ball.touches >= 3 },
    { t: 'Park the grounded wand on the far side of the ball, close enough for the ball to reach it.', ok: (w, d) => d.ball.groundHits >= 2, opt: true, note: 'The ball shuttles back and forth, carrying a little charge from the dome to the ground on every trip.' }
  ],
  see: 'The ball is pulled to the dome, touches it, then is pushed sharply away. It bounces back and forth.',
  why: P => `<p><b>Attract:</b> the neutral ball is polarized and pulled in (slide 11).</p><p><b>Touch:</b> charge is shared between the dome and the ball, giving the ball the same type of charge as the dome (slides 47–48). Electrons move ${P.s < 0 ? 'from the negative dome onto the ball' : 'from the ball onto the positive dome'}.</p><p><b>Repel:</b> like charges repel.</p><p>The ball comes back once it loses its charge to the air or to a nearby grounded object, and the cycle starts again.</p>`,

{ id: '7.2', part: 7, title: 'Charge-Sharing Sphere', core: true, slides: '47–50', world: { shelf: { x1: 730, x2: 960, y: 430, label: 'stand' } },
  intro: 'A small metal sphere on an insulating handle can carry charge from place to place. An electroscope on the far stand shows whether any charge arrives.',
  predict: [
    { q: 'If the sphere touches the dome, what kind of charge will it carry away?', a: ['The same type as the dome', 'The opposite type to the dome', 'None'], ok: 0 },
    { q: 'Will a plastic ruler pick up charge from the dome the same way?', a: ['No. It carries little or none', 'Yes. Just as much as the metal sphere', 'Yes. Even more than the sphere'], ok: 0 }
  ],
  tools: ['power', 'wand', 'finger', 'charges'],
  setup(w, d) { w.add(new Wand(w)); d.sc = w.add(new Scope(w, { x: 845, fixed: true })); d.pr = w.add(new Probe(w, { x: 560, y: 300 })); d.ru = w.add(new Rod(w, { x: 520, y: 440, style: 'ruler', len: 170 })); d.b = w.add(new Hanger(w, { px: 690, py: 20, L: 80, q: -1, label: '−', canRub: false })); },
  tick(w, d, dt) {
    ran(w, d); const v = w.vdg, s = d.sc;
    if (d.ran && !v.on && Math.abs(d.pr.q) > 0.5) d.p1 = true; if (d.p1 && Math.abs(s.q) > 0.2 && s.ang > 0.25) d.p2 = true;
    if (d.p2 && s.finger) d.p3a = true; if (d.p3a && !s.finger && s.ang < 0.05) d.p3 = true;
    if (d.p3 && d.ru.touching && Math.abs(v.Q) > 0.3 && !d.r1) d.r1 = w.t; if (d.r1 && w.flags.rulerOnScope > d.r1) d.r2 = true;
    if (d.p2 && Math.abs(s.q) > 0.2 && !d.b.held && hyp(d.b.bx - s.kx, d.b.by - s.ky) < 75) d.test = (d.test || 0) + dt;
  },
  steps: [
    { t: 'Charge the dome for about 10 seconds, then switch the machine off.', ok: (w, d) => d.ran && !w.vdg.on },
    { t: 'Holding the handle, touch the metal sphere to the dome, then pull it away.', ok: (w, d) => d.p1, hint: lostCharge },
    { t: 'Touch the sphere to the knob of the electroscope.', ok: (w, d) => d.p2, note: 'The leaves spread: the sphere carried charge across the room.' },
    { t: 'Hang the negative balloon close to the knob to identify the charge.', ok: (w, d) => d.test > 1, opt: true, note: P => P.s < 0 ? 'The leaves spread wider, so the electroscope is negative, like the dome.' : 'The leaves close up, so the electroscope is positive, like the dome.' },
    { t: 'Ground the electroscope: press <b>Finger on knob</b>, then press it again.', ok: (w, d) => d.p3, note: 'The leaves fall.' },
    { t: 'Repeat with the plastic ruler: touch it to the dome, then to the electroscope knob.', ok: (w, d) => d.r2, note: 'The leaves barely move. The ruler carried little or no charge.', hint: lostCharge },
    { ask: { q: 'After the sphere took some charge away, what is left on the dome?', a: ['The same type of charge, just less of it', 'The opposite type of charge', 'Nothing. The sphere took it all'], ok: 0, no: 'Check the dome charge meter: it dropped a little each time the sphere touched.' } }
  ],

    v.append(el('p', {}, `<span style="color:var(--ink-2)">What happens:</span> <b>${opts[ok]}</b>`)); panel.append(v);
  });
  panel.append(el('h2', {}, 'What you see'), el('p', { style: 'margin:0' }, val(demo.see, p, D.data, world)), el('h2', {}, 'Why it happens'), el('div', { class: 'why' }, val(demo.why, p, D.data, world)));
  if (demo.after) { const b = el('div', { class: 'block' }); demo.after(b, world, D.data); panel.append(b); }
  if (demo.say) panel.append(el('p', { class: 'sayit' }, `<span>Say it</span>“${val(demo.say, p)}”`));
  if (demo.safety) panel.append(el('p', { class: 'safety' }, `<b>In the real lab</b>${demo.safety}`));
  const row = el('div', { class: 'row' }), i = DEMOS.indexOf(demo), again = el('button', { class: 'btn', type: 'button' }, 'Run it again');
  if (i < DEMOS.length - 1) { const nx = el('button', { class: 'btn primary', type: 'button' }, `Next: ${DEMOS[i + 1].id} ${DEMOS[i + 1].title} →`); nx.onclick = () => startDemo(DEMOS[i + 1].id); row.append(nx); }
  else row.append(el('p', { class: 'q' }, 'That was the last demo. Try Free play next.'));
  again.onclick = resetDemo; row.append(again); panel.append(row);
}

/* ---------- toolbar ---------- */
const mk = (cls, html, attrs = {}) => el('button', Object.assign({ class: cls, type: 'button' }, attrs), html);
const field = (text, sel) => { const lb = el('label', { class: 'field' }, text + ' '); lb.append(sel); return lb; };
const TOOLS = {
  power() { const b = mk('btn power', '<span class="led"></span><span></span>', { id: 't_power', 'aria-pressed': 'false' }); b.onclick = () => { audio.ensure(); setPower(!world.vdg.on); }; return { el: b, sync() { const v = world.vdg; b.setAttribute('aria-pressed', v.on); b.lastChild.textContent = v.domeOff ? (v.on ? 'Belt: turning slowly' : 'Belt: stopped') : v.on ? 'Power: on' : 'Power: off'; } }; },
  wand() { const b = mk('btn', 'Touch wand to dome', { id: 't_wand' }); b.onclick = () => { audio.ensure(); const wd = find(Wand); if (wd) wd.touchDome(); }; return { el: b }; },
  charges() { const b = mk('btn', 'Show charges', { id: 't_charges', 'aria-pressed': 'false' }); b.onclick = () => { S.charges = !S.charges; }; return { el: b, sync() { b.setAttribute('aria-pressed', S.charges); } }; },
  lights() { const b = mk('btn', '', { id: 't_lights' }); b.onclick = () => { S.lights = !S.lights; }; return { el: b, sync() { b.textContent = S.lights ? 'Lights: on' : 'Lights: off'; b.setAttribute('aria-pressed', !S.lights); } }; },
  finger() { const b = mk('btn', 'Finger on knob', { id: 't_finger', 'aria-pressed': 'false' }); b.onclick = () => { const s = find(Scope); s.finger = !s.finger; }; return { el: b, sync() { b.setAttribute('aria-pressed', find(Scope).finger); } }; },
  hand() { const b = mk('btn', 'Hand on dome', { id: 't_hand', 'aria-pressed': 'false' }); b.onclick = () => { audio.ensure(); const v = find(Volunteer); v.setHand(!v.handOn); }; return { el: b, sync() { b.setAttribute('aria-pressed', find(Volunteer).handOn); } }; },
  stool() { const b = mk('btn', '', { id: 't_stool' }); b.onclick = () => { const v = find(Volunteer); v.setStool(!v.stool); }; return { el: b, sync() { b.textContent = 'Standing on: ' + (find(Volunteer).stool ? 'stool' : 'floor'); } }; },
  poke() { const b = mk('btn', 'Touch tin with finger', { id: 't_poke' }); b.onclick = () => { audio.ensure(); find(Electrophorus).touch(); }; return { el: b }; },
  open() {
    const b = mk('btn', '', { id: 't_open' });
    b.onclick = () => { const v = world.vdg; if (!v.domeOff && Math.abs(v.Q) > 0.05) { toast('Ground the dome with the wand before you lift it off.'); return; } v.domeOff = !v.domeOff; setPower(false); if (v.domeOff) S.charges = true; };
    return { el: b, sync() { b.textContent = world.vdg.domeOff ? 'Put the dome back' : 'Lift the dome off'; b.setAttribute('aria-pressed', world.vdg.domeOff); } };
  },
  roller() {
    const s = el('select', { id: 't_roller' }); ['Nylon', 'Glass', 'Vinyl (PVC)', 'Teflon'].forEach(m => s.append(new Option(m, m))); s.value = world.vdg.roller;
    s.onchange = () => { const v = world.vdg; v.roller = s.value; v.sign = sgn(rubCharge('Rubber', v.roller)) || -1; v.Q = 0; setPower(false); demo.steps.forEach((x, i) => { if (x.ask && !D.done[i]) delete D.asks[i]; }); D.data.dirty = true; };
    return { el: field('Lower roller', s) };
  },
  pair() {
    const box = el('span', { class: 'row' }), so = el('select', { id: 't_obj' }), sc = el('select', { id: 't_cloth' }), d = D.data;
    Object.keys(OBJ).forEach(k => so.append(new Option(OBJ[k].name, k))); CLOTHS.forEach(k => sc.append(new Option(k.toLowerCase(), k))); so.value = d.obj; sc.value = d.cl;
    so.onchange = sc.onchange = () => { d.obj = so.value; d.cl = sc.value; demo.fresh(world, d); };
    box.append(field('Object', so), field('Cloth', sc)); return { el: box };
  },
  hang() {
    const b = mk('btn', '', { id: 't_hang' }), d = D.data;
    b.onclick = () => { if (d.hang === 'object' && Math.abs(d.h.q) < 0.3) { toast('Rub the object on the cloth first.'); return; } demo.setHang(world, d, d.hang === 'object' ? 'cloth' : 'object'); };
    return { el: b, sync() { b.textContent = d.hang === 'cloth' ? 'Hang the object' : 'Hang the cloth'; } };
  },
  reset() { const b = mk('btn ghost', 'Reset', { id: 't_reset' }); b.onclick = resetDemo; return { el: b }; }
};
function renderToolbar() {
  toolbar.textContent = ''; tools = [];
  const list = S.mode === 'free' ? ['power', 'wand', 'charges', 'lights', ...(free.tray === 'scope' ? ['finger'] : [])] : demo.tools;
  for (const id of [...list, 'reset']) { if ((id === 'power' || id === 'wand') && !world.vdg) continue; const t = TOOLS[id](); tools.push(t); toolbar.append(t.el); }
  toolbar.inert = !!world.locked;
}

/* ---------- pointer input ---------- */
const toWorld = e => { const r = cv.getBoundingClientRect(), k = world && world.cam; let x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H; if (k) { x = x / k.s + k.x; y = y / k.s + k.y; } return [x, y]; };
cv.addEventListener('pointerdown', e => {
  if (!world || world.locked) return; const [x, y] = toWorld(e); audio.ensure();
  if (world.vdg && world.vdg.hitSwitch(x, y)) { setPower(!world.vdg.on); return; }
  for (let i = world.props.length - 1; i >= 0; i--) { const h = world.props[i].pick(x, y); if (h) { drag = h; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } h.move(x, y); cv.style.cursor = 'grabbing'; e.preventDefault(); break; } }
});
cv.addEventListener('pointermove', e => {
  if (!world) return; const [x, y] = toWorld(e);
  if (drag) { drag.move(x, y); return; }
  if (world.locked) { cv.style.cursor = 'default'; return; }
  let cur = world.vdg && world.vdg.hitSwitch(x, y) ? 'pointer' : 'default';
  if (cur === 'default') for (let i = world.props.length - 1; i >= 0; i--) if (world.props[i].pick(x, y, true)) { cur = 'grab'; break; }
  cv.style.cursor = cur;
});
const drop = () => { if (drag) { drag.end(); drag = null; cv.style.cursor = 'grab'; } };
cv.addEventListener('pointerup', drop); cv.addEventListener('pointercancel', drop);

/* ---------- main loop ---------- */
function resize() { const r = wrap.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.max(2, Math.round(r.width * dpr)); cv.height = Math.max(2, Math.round(r.width * dpr * H / W)); scale = cv.width / W; }
if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap); else window.addEventListener('resize', resize);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.034, Math.max(0, (now - last) / 1000)); last = now;
  if (world) {
    world.update(dt);
    if (S.mode === 'guided') {
      if (demo.tick && D.stage !== 'predict') demo.tick(world, D.data, dt);
      if (D.data.dirty) { D.data.dirty = false; refreshExtra(); }
      evalSteps();
    }
    ctx.setTransform(scale, 0, 0, scale, 0, 0); world.draw(ctx);
    for (const t of tools) if (t.sync) t.sync();
  }
  requestAnimationFrame(frame);
}

/* ---------- wiring ---------- */
$('#modeGuided').onclick = () => setMode('guided'); $('#modeFree').onclick = () => setMode('free');
$('#polNeg').onclick = () => setPolarity(-1); $('#polPos').onclick = () => setPolarity(1);
$('#soundBtn').onclick = () => { S.sound = !S.sound; if (S.sound) { audio.ensure(); audio.setHum(!!world && !!world.vdg && world.vdg.on); } else audio.setHum(false); renderHeader(); };
$('#demoPick').onclick = () => { renderMenu(); $('#menu').showModal(); };
$('#menuClose').onclick = () => $('#menu').close();
$('#menu').addEventListener('click', e => { if (e.target === $('#menu')) $('#menu').close(); });
const stepDemo = n => { const i = DEMOS.indexOf(demo) + n; if (i >= 0 && i < DEMOS.length) startDemo(DEMOS[i].id); };
$('#prevDemo').onclick = () => stepDemo(-1); $('#nextDemo').onclick = () => stepDemo(1);

/* test hook: lets a script drive the bench (used for automated checks, not by the page itself) */
window.VDG = {
  get world() { return world; }, get demo() { return demo; }, get state() { return D; }, settings: S, start: startDemo, mode: setMode, classes: { Wand, Hanger, RubPad, Rod, Tube, Probe, Scope, RollCan, TwoCans, Volunteer, TinStack, RiceCup, PaperBits, HandBalloon, Faucet, Electrophorus, Strands },
  begin() { if (D.stage === 'predict') { D.picks = demo.predict.map(() => 0); D.stage = 'test'; world.locked = false; $('#lock').hidden = true; toolbar.inert = false; renderPanel(); } },
  run(sec) { for (let t = 0; t < sec; t += 1 / 60) { world.update(1 / 60); if (S.mode === 'guided') { if (demo.tick) demo.tick(world, D.data, 1 / 60); if (D.data.dirty) { D.data.dirty = false; refreshExtra(); } evalSteps(); } } return S.mode === 'guided' ? D.done.slice() : null; }
};

resize();
const hash = decodeURIComponent(location.hash.slice(1));
if (hash === 'free') setMode('free'); else startDemo(DEMOS.some(d => d.id === hash) ? hash : store.get('demo', '0'));
requestAnimationFrame(frame);
})();
</script>
</body>
